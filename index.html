<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OW2 PLAYER RANKINGS | 身内ランキング(β)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E" />
<style>
/* ============ 共通 ============ */
:root{--blue:#2563eb;--border:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Inter","Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;color:#111827;background:#fff;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ============ コンテンツ(白・VLR風) ============ */
.content{background:#fff;padding:26px 18px 70px}
.wrap{max-width:1280px;margin:0 auto}

/* プレイヤー要約ストリップ */
.pf-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.pf-sel .filter-btn{font-size:12px}
.profile{
  display:flex;gap:20px;align-items:center;flex-wrap:wrap;
  padding:16px 18px;border:1px solid var(--border);border-radius:14px;
  box-shadow:0 1px 3px rgba(16,24,40,.06);margin-bottom:16px;background:#fff;
}
.avatar-lg{
  width:66px;height:66px;border-radius:16px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1d4ed8,#38bdf8);color:#fff;
  font-size:30px;font-weight:800;box-shadow:0 4px 10px rgba(29,78,216,.35);
}
.pf-main{min-width:230px}
.pf-name{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pf-tag{color:#6b7280;font-weight:600;font-size:14px}
.pf-rank{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.rank-pill{font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 9px;border-radius:999px;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.rank-role.damage{background:#fde7d9;color:#c2410c}
.rank-role.tank{background:#fee2e2;color:#b91c1c}
.rank-role.support{background:#d9f3e4;color:#047857}
.rank-tier{background:#ccfbf1;color:#0f766e;border:1px solid #5eead4}
.rank-pill.rank-tier img{width:17px;height:17px;border-radius:5px;display:inline-block}
.pf-note{font-size:11.5px;color:#9ca3af;margin-top:4px}
.pf-stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.stat-box{border:1px solid var(--border);border-radius:10px;padding:7px 14px;min-width:96px;background:#fafafa}
.stat-box .k{font-size:10.5px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:5px}
.stat-box .v{font-size:17px;font-weight:800;margin-top:1px}
.stat-box .s{font-size:10.5px;color:#9ca3af}

/* テーブル周辺 */
.table-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:26px 0 4px}
.table-head h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.table-head .sub{color:#6b7280;font-size:12.5px;margin-top:2px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-btn{
  appearance:none;border:1px solid var(--border);background:#fff;color:#374151;
  font:inherit;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer;
}
.filter-btn:hover{border-color:#cbd5e1;background:#f9fafb}
.filter-btn.active{background:#111827;color:#fff;border-color:#111827}
.note{font-size:11px;color:#9ca3af}

.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
table.rank{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:1200px;background:#fff}
table.rank thead th{
  position:sticky;top:0;z-index:5;
  background:#f3f4f6;color:#4b5563;
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.rank thead th:first-child, table.rank thead th:nth-child(2){text-align:left}
table.rank thead th .sortable{
  appearance:none;border:0;background:transparent;font:inherit;cursor:pointer;color:inherit;
  display:inline-flex;align-items:center;gap:4px;padding:0;text-transform:inherit;letter-spacing:inherit;
}
table.rank thead th .sortable:hover{color:#111827}
.arrow{color:#9ca3af;font-size:9px}
.arrow.on{color:#2563eb}
table.rank tbody td{
  padding:8px 10px;border-bottom:1px solid #f0f1f3;text-align:left;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
table.rank tbody tr.row{cursor:pointer;transition:background .12s}
table.rank tbody tr.row:hover{background:#f9fafb}
table.rank tbody tr.row.open{background:#f6f8ff}
table.rank tbody td:first-child{color:#9ca3af;font-weight:700}
table.rank tbody td:nth-child(2), table.rank tbody td:nth-child(4){text-align:left;white-space:normal}

/* 順位メダル */
.medal{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;font-weight:800;font-size:11px}
.medal.m1{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#78350f}
.medal.m2{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#1f2937}
.medal.m3{background:linear-gradient(135deg,#fbd7a8,#c2703d);color:#431407}
.medal.n{color:#9ca3af}

/* プレイヤーセル */
.pl-cell{display:flex;align-items:center;gap:9px}
.pl-av{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;background:#2563eb}
.pl-av.d2{background:#7c3aed}.pl-av.d3{background:#0891b2}.pl-av.d4{background:#db2777}.pl-av.d5{background:#16a34a}.pl-av.d6{background:#ea580c}
.pl-name{color:var(--blue);font-weight:700;cursor:pointer}
.pl-name:hover{text-decoration:underline}
.pl-tag{color:#9ca3af;font-size:11px;margin-left:3px}
.chev{color:#9ca3af;font-size:10px;margin-left:auto;transition:transform .2s;flex:0 0 auto}
tr.row.open .chev{transform:rotate(180deg);color:#2563eb}

/* ロールチップ */
.role-chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.role-chip.tank{background:#fee2e2;color:#b91c1c}
.role-chip.damage{background:#fde7d9;color:#c2410c}
.role-chip.support{background:#d9f3e4;color:#047857}
/* 公式ロールアイコン(白グリフ)+ロール色バッジ */
.rbadge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;flex:0 0 auto;vertical-align:-2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.rbadge img{width:10px;height:10px;display:block}
.rbadge.tank{background:#dc2626}
.rbadge.damage{background:#ea580c}
.rbadge.support{background:#059669}
.role-chip .rbadge{width:13px;height:13px}
.role-chip .rbadge img{width:8.5px;height:8.5px}

/* 条件付き色分けセル */
.cell{min-width:52px}
.wr-good{background:#dcfce7;color:#166534;font-weight:700}
.wr-bad{background:#fee2e2;color:#991b1b;font-weight:700}
.kda-good{background:#dbeafe;color:#1e40af;font-weight:700}
.kda-bad{background:#ffedd5;color:#9a3412;font-weight:700}

/* メインヒーロー3体 */
.heroes-cell{display:flex;flex-direction:column;gap:3px;min-width:190px}
.hl{display:flex;align-items:baseline;gap:7px;font-size:12px}
.hl .hn{font-weight:700;color:#1f2937}
.hl .hm{font-size:10.5px;color:#6b7280}
.hl .hdot{width:6px;height:6px;border-radius:2px;flex:0 0 auto;align-self:center}
.hdot.tank{background:#ef4444}.hdot.damage{background:#f97316}.hdot.support{background:#10b981}

/* アコーディオン詳細行 */
tr.detail-row td{background:#fbfcfe;padding:0!important;border-bottom:1px solid var(--border)}
.acc{max-height:0;overflow:hidden;transition:max-height .32s ease}
.acc-inner{padding:14px 18px 16px;border-top:1px dashed #d8dde6}
.acc h4{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6b7280;font-weight:800;margin:0 0 8px}
.acc-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
@media(max-width:860px){.acc-grid{grid-template-columns:1fr}}
table.mini{width:100%;border-collapse:collapse;font-size:11.5px}
table.mini th{background:#f3f4f6;color:#6b7280;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:5px 8px;text-align:left;border:1px solid #eceef1}
table.mini th:first-child{text-align:left}
table.mini td{padding:5px 8px;text-align:left;border:1px solid #f0f1f3;font-variant-numeric:tabular-nums}
table.mini td:first-child{text-align:left;white-space:nowrap}
.hero-name{font-weight:700;color:#111827}

/* ヒーロー画像サムネイル */
.himg{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;background:#e9eef5;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.himg i{position:absolute;font-style:normal;font-weight:800;color:#8b98ab;font-size:.62em}
.himg img{position:relative;width:100%;height:100%;object-fit:cover;object-position:center 18%}
.himg.s16{width:16px;height:16px}.himg.s20{width:20px;height:20px}
.himg.s26{width:26px;height:26px}.himg.s34{width:34px;height:34px}
.himg.s44{width:44px;height:44px}.himg.s56{width:56px;height:56px}
.himg.tank{outline:2px solid #ef444466}.himg.damage{outline:2px solid #f9731666}.himg.support{outline:2px solid #10b98166}
.himg.tank i{color:#b91c1c}.himg.damage i{color:#c2410c}.himg.support i{color:#047857}

/* プレイヤーカード */
.pcard{
  display:flex;flex-direction:column;gap:12px;margin-bottom:14px;
  background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;
}
.pc-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pc-av{width:52px;height:52px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;background:#2563eb;box-shadow:0 3px 8px rgba(37,99,235,.3)}
.pc-av.tank{background:#dc2626}.pc-av.damage{background:#ea580c}.pc-av.support{background:#059669}
.pc-id{min-width:200px}
.pc-name{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.pc-kpis{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pc-kpi{border:1px solid #e8ebef;background:#fafbfc;border-radius:8px;padding:4px 10px;min-width:72px}
.pc-kpi .k{font-size:9.5px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.07em}
.pc-kpi .v{font-size:14px;font-weight:800;line-height:1.25}
.pc-heroes{display:flex;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px dashed #e2e6ec}
.ph-tile{display:flex;align-items:center;gap:9px;border:1px solid var(--border);background:#fbfcfe;border-radius:10px;padding:6px 11px 6px 6px;min-width:150px}
.ph-tile .ph-n{font-weight:700;font-size:12.5px}
.ph-tile .ph-s{font-size:10.5px;color:#6b7280}
.pc-role-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

/* プロフィール要約のヒーロー行 */
.pf-heroes{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.pf-h{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:9px;background:#fafbfc;padding:4px 10px 4px 4px}
.pf-hl{font-size:10.5px;color:#6b7280;line-height:1.35}
.pf-hl b{color:#111827;font-size:11.5px;display:block}

/* アバター画像(公式アイコン) */
.avatar-lg,.pl-av,.pc-av{position:relative;overflow:hidden}
.avatar-lg i,.pl-av i,.pc-av i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal}
.avatar-lg .face,.pl-av .face,.pc-av .face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.pf-title{font-size:11px;color:#64748b;margin-top:2px;font-weight:600;letter-spacing:.02em}
.rr{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.05em;padding:1px 7px 1px 4px;border-radius:999px;background:#eef2f7;color:#334155;border:1px solid #dfe5ee;text-transform:uppercase}
.rr img{width:15px;height:15px;border-radius:4px;display:block}
.rr.unrank{background:#f6f7f9;color:#98a2b3;border:1px dashed #d3d9e0}

/* フッター */
.foot{color:#9ca3af;font-size:11.5px;margin-top:18px;text-align:center;line-height:1.9}
</style>
</head>
<body>

<main class="content">
  <div class="wrap">

    <!-- プレイヤー選択 & 要約 -->
    <div class="pf-sel" id="pfSel"></div>
    <div class="profile" id="profileBox"></div>

    <!-- テーブル -->
    <div class="table-head">
      <div>
        <h2>Player Rankings — Overwatch 2</h2>
        <div class="sub">出典: OverFast API(2025年1月時点) / 列ヘッダークリックでソート / 行クリックでヒーロー別詳細</div>
      </div>
      <div class="tools" id="toolbar">
        <button class="filter-btn active" data-role="All">All</button>
        <button class="filter-btn" data-role="Tank">Tank</button>
        <button class="filter-btn" data-role="Damage">Damage</button>
        <button class="filter-btn" data-role="Support">Support</button>
      </div>
    </div>

    <div class="scroll-x">
      <table class="rank" id="rankTable">
        <thead>
          <tr>
            <th style="width:44px">#</th>
            <th style="width:230px"><button class="sortable" data-key="name">Player<span class="arrow"></span></button></th>
            <th style="text-align:left">Role</th>
            <th style="width:150px;text-align:left"><button class="sortable" data-key="rank">Rank<span class="arrow"></span></button></th>
            <th style="width:220px;text-align:left">Main Heroes</th>
            <th><button class="sortable" data-key="matches">Match<span class="arrow"></span></button></th>
            <th><button class="sortable" data-key="wr">WR<span class="arrow"></span></button></th>
            <th><button class="sortable" data-key="kda">KDA<span class="arrow"></span></button></th>
            <th><button class="sortable" data-key="elim">ELIM/10<span class="arrow"></span></button></th>
            <th><button class="sortable" data-key="dmg">DMG/10<span class="arrow"></span></button></th>
            <th><button class="sortable" data-key="heal">HEAL/10<span class="arrow"></span></button></th>
            <th><button class="sortable" data-key="time">Time<span class="arrow"></span></button></th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
    <div class="note" id="filterInfo" style="margin-top:8px"></div>

    <div class="foot">
      ※ 緑=勝率55%超 / 赤=勝率40%未満 / 青=KDA3.0超 / 橙=KDA1.5未満<br />
      本ページは設計プロトタイプです。データは与えられたスナップショットを表示しています。
    </div>
  </div>
</main>

 'Baptiste':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/d4e6f1ca45d9f88fa89260787397f141a6f007b14e5b26698883b6a17bab9680.png',
 'Ashe':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/4076bbaa2eb52a0bfe612434071e56e7702d5454473dbbea2f9e392a9d997a94.png',
 'Widowmaker':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/6e4702b45f196aaf51555cf57327322721f45458b17f5f0643ed008a88378259.png',
 'Junker Queen':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/06eeecb359f311f43a8f5121d4f9f3a93c565d70b30e94ef543c05596c9a39dc.png',
 'Reinhardt':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/551fbe070c16fdfcc17f7f1de63af22c53e7d2f1340fc2f3172441504527bc4e.png',
 'Mercy':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/3bfb8bd8ec827e53d870f1238ab73d8aa1f5dbfbcfaaf7f96ffcd35b5c6102ab.png',
 'Lifeweaver':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/3376515cebed0904012e67e956f6d1b9c12e03da642845eeaf787b7e4c7b339d.png',
 'Cassidy':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/9240cd64cc8ef58df9acbf55204ab1b5d8578f743fda5931f0dbccbd75ab841b.png',
 'Reaper':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/dc6ff07ac790c00dc95a40882449617bb6e0e38906b353a630cffe0c815270a9.png',
 'Genji':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/156b12c20b1aea872c1eeb5bb37a7de1047b2ab30ecefd0663a8925badde1ea8.png',
 'Ana':'https://d15f34w2p8l1cc.cloudfront.net/overwatch/985b06beae46b7ba3ca87d1512d0fc62ca7f206ceca58ef16fc44d43a1cc84ed.png'
};
function heroImg(name){return HERO_IMG[name]||''}
function heroThumb(name,size,role,slug){
  const u=(slug&&SLUG_URL[slug])||heroImg(name);
  const letter=esc((name||'?').trim().charAt(0).toUpperCase());
  return `<span class="himg s${size} ${roleCls(role||'')}" title="${esc(name)}">`+
    `<i>${letter}</i>`+(u?`<img src="${u}" alt="${esc(name)}" loading="lazy" decoding="async" onerror="this.style.display='none'">`:'')+`</span>`;
}

/* =====================================================================
 * テーブルユーティリティ
 * =================================================================== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0;
const fmtN=v=>Math.round(num(v)).toLocaleString('en-US');
const fmt1=v=>num(v).toFixed(1);
const fmt2=v=>num(v).toFixed(2);
const fmtTime=s=>{if(s===null||s===undefined)return '—';s=num(s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?`${h}:${String(m).padStart(2,'0')}`:`${m}m`};
const roleCls=r=>String(r).toLowerCase();
const ROLE_ICON={
  'Tank':'https://blz-contentstack-images.akamaized.net/v3/assets/blt9c12f249ac15c7ec/blt29de38a72c3ea6e5/63055efed3da0846f3f4a347/Tank.svg',
  'Damage':'https://blz-contentstack-images.akamaized.net/v3/assets/blt9c12f249ac15c7ec/blt99f5a322d8ebb7d2/63055efe765dbe3289348da2/Damage.svg',
  'Support':'https://blz-contentstack-images.akamaized.net/v3/assets/blt9c12f249ac15c7ec/blt28a65b324269d06b/63055efe1872995d912945be/Support.svg'
};
function roleIcon(r){
  const u=ROLE_ICON[r];
  return u
    ? `<span class="rbadge ${roleCls(r)}" title="${esc(r)}"><img src="${u}" alt="" loading="lazy" onerror="this.parentElement.style.display='none'"></span>`
    : esc(r);
}

function wrCls(v){const n=num(v);return n>55?'wr-good':n<40?'wr-bad':''}
function kdaCls(v){const n=num(v);return n>3.0?'kda-good':n<1.5?'kda-bad':''}
function wrCell(v){const n=v===null||v===undefined?null:num(v);return `<td class="num cell ${n===null?'':wrCls(n)}">${n===null?'—':fmt1(n)+'%'}</td>`}
function kdaCell(v){const n=v===null||v===undefined?null:num(v);return `<td class="num cell ${n===null?'':kdaCls(n)}">${n===null?'—':fmt2(n)}</td>`}

const state={filter:'All',sortKey:'rank',sortAsc:false,open:new Set(),focus:'hiyori'};

/* ランク順ソート用(division階層 + tierは小さいほど上位) */
const DIV_ORDER=['bronze','silver','gold','platinum','diamond','emerald','master','grandmaster'];
function roleKeyOf(p){return state.filter==='All'?p.role:state.filter}
function rankScore(p,role){
  const rk=(p.ranks&&p.ranks[role])||null;
  if(!rk||!rk.division)return -1;
  const i=DIV_ORDER.indexOf(String(rk.division).toLowerCase());
  if(i<0)return -1;
  return i*10+(6-(Number(rk.tier)||1));
}

/* ロールフィルタ対応ヘルパー */
function heroesOfRole(p,role){
  const list=p.heroes.filter(h=>role==='All'||h.role===role);
  return list.slice().sort((a,b)=>b.g-a.g||num(b.wr)-num(a.wr));
}
function roleSummaryKeys(p){
  const keys=Object.keys(p.roles||{});
  return state.filter==='All'?keys:keys.filter(k=>k===state.filter);
}
function filterNote(){return state.filter==='All'?'':`${state.filter} ロール表示中(ヒーロー・試合数・成績とも対象ロールの値)`}
/* フィルター中はそのロールの集計値(無ければ全体)を返す */
function statsFor(p){
  const f=state.filter,o=p.overall;
  if(f==='All')return o;
  const r=p.roles&&p.roles[f];
  if(!r)return o;
  return {
    matches:r.g,
    wins:r.w!=null?r.w:null,
    losses:r.l!=null?r.l:null,
    wr:r.wr,kda:r.kda,elim:r.elim,
    deaths:r.deaths!=null?r.deaths:null,
    dmg:r.dmg,heal:r.heal,
    time:r.time!=null?r.time:null,
    roleName:f
  };
}

/* プレイヤー要約(選択中のプレイヤーを表示) */
function focusPlayer(){return PLAYERS.find(p=>p.id===state.focus)||PLAYERS[0]}
function renderSel(){
  const el=$('#pfSel'); if(!el)return;
  el.innerHTML=PLAYERS.map(p=>`<button class="filter-btn ${p.id===state.focus?'active':''}" data-pid="${p.id}">${esc(p.name)}${p.tag?esc(p.tag):''}</button>`).join('');
}
function pfHeroes(p){
  const top=heroesOfRole(p,state.filter).slice(0,5);
  return top.map(h=>`
    <div class="pf-h">${heroThumb(h.n,34,h.role,h.slug)}
      <div class="pf-hl"><b>${esc(h.n)}</b>${h.g}試合・WR ${fmt1(h.wr)}%</div></div>`).join('');
}
function rankName(rk){
  if(!rk||!rk.division)return '';
  const d=rk.division.charAt(0).toUpperCase()+rk.division.slice(1);
  return rk.tier?`${d} ${rk.tier}`:d;
}
function rankChip(p,role){
  const rk=p.ranks&&p.ranks[role];
  if(!rk)return '<span class="rr unrank">アンランク</span>';
  return `<span class="rr">${rk.icon?`<img src="${rk.icon}" alt="" loading="lazy" onerror="this.remove()">`:''}${esc(rankName(rk))}</span>`;
}
function tierPill(p){
  if(!p.rankTier)return '';
  const ic=(p.ranks&&p.ranks[p.role]&&p.ranks[p.role].icon)
    ?`<img src="${p.ranks[p.role].icon}" alt="" loading="lazy" onerror="this.remove()">`:'';
  return `<span class="rank-pill rank-tier">${ic}${esc(p.rankTier)}</span>`;
}
function faceMarkup(p){
  const init=esc(p.name.trim().charAt(0));
  return p.avatar
    ? `<i>${init}</i><img class="face" src="${p.avatar}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`
    : init;
}
function renderProfile(p){
  const ph=pfHeroes(p);
  const tier=tierPill(p);
  const title=p.title?`<div class="pf-title">🏷 「${esc(p.title)}」</div>`:'';
  const s=statsFor(p);
  const f=state.filter;
  const noteParts=[];
  if(f!=='All')noteParts.push(`${f}ロールの成績`);
  if(s.wins!=null)noteParts.push(`戦績 ${s.wins}勝 ${s.losses}敗`);
  const note=noteParts.join(' ・ ');
  const sum=g=>{const d=p.roles[g];if(!d)return '';
    return `
    <div class="stat-box"><div class="k">${roleIcon(g)} ${g}</div>
      <div class="v">${d.g}試合</div>
      <div class="s">WR ${fmt1(d.wr)}% ・ KDA ${fmt2(d.kda)}</div>
      ${rankChip(p,g)}</div>`;};
  const roleBoxes=roleSummaryKeys(p).map(k=>sum(k)).join('');
  const pb=$('#profileBox');
  pb.style.backgroundImage='none';
  $('#profileBox').innerHTML=`
    <div class="avatar-lg">${faceMarkup(p)}</div>
    <div class="pf-main">
      <div class="pf-name">${esc(p.name)}${p.tag?`<span class="pf-tag">${esc(p.tag)}</span>`:''}
      </div>
      ${title}
      <div class="pf-rank">
        <span class="rank-pill rank-role ${roleCls(p.role)}">${roleIcon(p.role)} ${p.role}</span>
        ${tier}
        <span class="pf-note">${note}</span>
      </div>
      ${ph?`<div class="pf-heroes">${ph}</div>`:''}
    </div>
    <div class="pf-stats">
      <div class="stat-box"><div class="k">Matches</div><div class="v">${fmtN(s.matches)}</div><div class="s">${f==='All'?'通算':`${f}のみ`}</div></div>
      <div class="stat-box"><div class="k">Win Rate</div><div class="v" style="color:${s.wr>55?'#16a34a':s.wr<40?'#dc2626':'#111827'}">${fmt1(s.wr)}%</div><div class="s">${s.wins!=null?`${s.wins}勝 / ${s.losses}敗`:'勝敗データなし'}</div></div>
      <div class="stat-box"><div class="k">KDA</div><div class="v">${fmt2(s.kda)}</div><div class="s">${fmt1(s.elim)} ELIM${s.deaths!=null?` / ${fmt1(s.deaths)} DEATH`:''}</div></div>
      <div class="stat-box"><div class="k">Time</div><div class="v">${fmtTime(s.time)}</div><div class="s">プレイ時間</div></div>
      ${roleBoxes}
    </div>`;
}

/* セル生成 */
function heroesCell(p){
  const top=heroesOfRole(p,state.filter).slice(0,3);
  if(!top.length)return `<div class="heroes-cell"><span style="color:#9ca3af;font-size:12px">—</span></div>`;
  return `<div class="heroes-cell">`+top.map(h=>`
    <div class="hl">${heroThumb(h.n,20,h.role,h.slug)}
      <span class="hn">${esc(h.n)}</span>
      <span class="hm">${h.g}試合・${fmt1(h.wr)}%</span></div>`).join('')+`</div>`;
}
/* プレイヤーカード(アコーディオン上部に表示) */
function playerCard(p){
  const o=statsFor(p);
  const f=state.filter;
  const kpi=(k,v,s)=>`<div class="pc-kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s" style="font-size:9.5px;color:#9ca3af">${s||''}</div></div>`;
  const chips=[];
  chips.push(`<span class="rank-pill rank-role ${roleCls(p.role)}">${roleIcon(p.role)} ${p.role}</span>`);
  const tp=tierPill(p);
  if(tp)chips.push(tp);
  const top=heroesOfRole(p,state.filter).slice(0,3);
  const tiles=top.map(h=>`
    <div class="ph-tile">${heroThumb(h.n,44,h.role,h.slug)}
      <div><div class="ph-n">${esc(h.n)}</div>
      <div class="ph-s">${h.g}試合 ・ WR ${fmt1(h.wr)}%${h.kda!=null?` ・ KDA ${fmt2(h.kda)}`:''}</div></div></div>`).join('');
  return `
  <div class="pcard">
    <div class="pc-head">
      <span class="pc-av ${roleCls(p.role)}">${faceMarkup(p)}</span>
      <div class="pc-id">
        <div class="pc-name">${esc(p.name)}${p.tag?`<span class="pf-tag">${esc(p.tag)}</span>`:''}</div>
        ${p.title?`<div class="pf-title">🏷 「${esc(p.title)}」</div>`:''}
        <div class="pc-meta">${chips.join('')}</div>
      </div>
      <div class="pc-kpis">
        ${kpi('Matches',fmtN(o.matches),f==='All'?'通算':`${f}のみ`)}
        ${kpi('WR',fmt1(o.wr)+'%',o.wins!=null?`${o.wins}勝/${o.losses}敗`:f==='All'?'':'勝敗データなし')}
        ${kpi('KDA',fmt2(o.kda))}
        ${kpi('ELIM/10',fmt1(o.elim))}
        ${kpi('DMG/10',fmtN(o.dmg))}
        ${kpi('HEAL/10',fmtN(o.heal))}
        ${kpi('Time',fmtTime(o.time))}
      </div>
    </div>
    ${tiles?`<div class="pc-heroes">${tiles}</div>`:''}
  </div>`;
}
function playerCell(p,i){
  const avCls=['','d2','d3','d4','d5','d6'];
  return `<div class="pl-cell">
      <span class="pl-av ${avCls[i]||''}">${faceMarkup(p)}</span>
      <span class="pl-name">${esc(p.name)}${p.tag?`<span class="pl-tag">${esc(p.tag)}</span>`:''}</span>
      <span class="chev">▼</span>
    </div>`;
}

/* ソート */
function sortRows(list){
  if(!state.sortKey||list.length<2)return list;
  const dir=state.sortAsc?1:-1;
  return list.slice().sort((a,b)=>{
    if(state.sortKey==='name')return String(a.name).localeCompare(String(b.name),'ja')*dir;
    if(state.sortKey==='rank')return (rankScore(a,roleKeyOf(a))-rankScore(b,roleKeyOf(b)))*dir;
    const va=statsFor(a)[state.sortKey],vb=statsFor(b)[state.sortKey];
    return (num(va)-num(vb))*dir;
  });
}

/* アコーディオン詳細(ロールフィルタ対応:ヒーロー別 + ロール別) */
function accHtml(p){
  const hs=heroesOfRole(p,state.filter);
  const roleLabel=state.filter==='All'?'':`(${state.filter})`;
  const hrows=hs.map(h=>`
    <tr>
      <td style="display:flex;align-items:center;gap:7px">${heroThumb(h.n,26,h.role,h.slug)}
        <span class="hero-name">${esc(h.n)}</span>
        <span class="role-chip ${roleCls(h.role)}">${roleIcon(h.role)}</span></td>
      <td class="num">${h.g}</td>
      ${wrCell(h.wr)}
      ${kdaCell(h.kda)}
    </tr>`).join('');
  const hEmpty=hs.length?``:`<div style="color:#9ca3af;font-size:12px;padding:6px 0">該当ロールのヒーロー記録はありません</div>`;
  let roleBlock='';
  if(p.roles){
    const rk=roleSummaryKeys(p);
    if(rk.length){
      const rrows=rk.map(k=>{const v=p.roles[k];return `
      <tr>
        <td><span class="role-chip ${roleCls(k)}">${roleIcon(k)} ${k}</span></td>
        <td style="text-align:left">${rankChip(p,k)}</td>
        <td class="num">${v.g}</td>
        ${wrCell(v.wr)}
        ${kdaCell(v.kda)}
        <td class="num">${fmt1(v.elim)}</td>
        <td class="num">${fmtN(v.dmg)}</td>
        <td class="num">${fmtN(v.heal)}</td>
      </tr>`;}).join('');
      roleBlock=`<div><h4>Role Breakdown(ロール別成績)${roleLabel}</h4>
        <div class="scroll-x" style="border-radius:8px"><table class="mini">
          <thead><tr><th>Role</th><th style="text-align:left">Rank</th><th>Matches</th><th>WR</th><th>KDA</th><th>ELIM/10</th><th>DMG/10</th><th>HEAL/10</th></tr></thead>
          <tbody>${rrows}</tbody></table></div></div>`;
    }
  }
  return `<div class="acc"><div class="acc-inner">
    ${playerCard(p)}
    <div class="acc-grid">
      ${roleBlock}
      <div><h4>Hero Breakdown(ヒーロー別・試合数順)${roleLabel}</h4>
        <div class="scroll-x" style="border-radius:8px"><table class="mini">
          <thead><tr><th>Hero</th><th>Matches</th><th>WR</th><th>KDA</th></tr></thead>
          <tbody>${hrows}</tbody></table></div>
        ${hEmpty}</div>
    </div></div></div>`;
}

function renderTable(){
  const list=sortRows(PLAYERS);
  const medal=i=>i===0?'m1':i===1?'m2':i===2?'m3':'n';
  const rows=list.map((p,i)=>{
    const o=statsFor(p);
    const open=state.open.has(p.id)?'open':'';
    return `
      <tr class="row ${open}" data-id="${p.id}">
        <td><span class="medal ${medal(i)}">${i+1}</span></td>
        <td>${playerCell(p,i)}</td>
        <td style="text-align:left"><span class="role-chip ${roleCls(p.role)}">${roleIcon(p.role)} ${p.role}</span></td>
        <td style="text-align:left">${rankChip(p,roleKeyOf(p))}</td>
        <td>${heroesCell(p)}</td>
        <td class="num">${fmtN(o.matches)}</td>
        ${wrCell(o.wr)}
        ${kdaCell(o.kda)}
        <td class="num cell">${fmt1(o.elim)}</td>
        <td class="num cell">${fmtN(o.dmg)}</td>
        <td class="num cell">${fmtN(o.heal)}</td>
        <td class="num" ${o.time!=null?`title="${Math.floor(o.time/3600)}時間${Math.floor((o.time%3600)/60)}分"`:''}>${fmtTime(o.time)}</td>
      </tr>
      ${open?`<tr class="detail-row" data-detail="${p.id}"><td colspan="12">${accHtml(p)}</td></tr>`:''}`;
  }).join('');
  $('#rankBody').innerHTML=rows;
  requestAnimationFrame(()=>{
    document.querySelectorAll('tr.detail-row').forEach(tr=>{
      const acc=tr.querySelector('.acc');
      acc.style.maxHeight=acc.scrollHeight+'px';
    });
  });
  const note=filterNote();
  const noteEl=document.getElementById('filterInfo');
  if(noteEl)noteEl.textContent=note;
}

function updateArrows(){
  document.querySelectorAll('#rankTable thead .sortable').forEach(b=>{
    const a=b.querySelector('.arrow');
    if(b.dataset.key===state.sortKey){a.textContent=state.sortAsc?'▲':'▼';a.classList.add('on');}
    else{a.textContent='';a.classList.remove('on');}
  });
}

/* イベント */
$('#rankBody').addEventListener('click',e=>{
  const tr=e.target.closest('tr.row');
  if(!tr)return;
  const id=tr.dataset.id;
  state.focus=id;               // クリックしたプレイヤーを要約に表示
  renderSel();
  renderProfile(focusPlayer());
  if(state.open.has(id))state.open.delete(id);else state.open.add(id);
  renderTable();
});
$('#rankTable thead').addEventListener('click',e=>{
  const b=e.target.closest('.sortable');
  if(!b)return;
  const key=b.dataset.key;
  if(state.sortKey===key)state.sortAsc=!state.sortAsc;
  else{state.sortKey=key;state.sortAsc=key==='name';}
  updateArrows();renderTable();
});
$('#toolbar').addEventListener('click',e=>{
  const f=e.target.closest('.filter-btn');
  if(!f)return;
  state.filter=f.dataset.role;
  $('#toolbar').querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x===f));
  renderProfile(focusPlayer()); // 要約ストリップのヒーロー/ロール表示も追従
  renderTable();
});
$('#pfSel').addEventListener('click',e=>{
  const b=e.target.closest('[data-pid]');
  if(!b)return;
  state.focus=b.dataset.pid;
  $('#pfSel').querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x===b));
  renderProfile(focusPlayer());
});

renderSel();
renderProfile(focusPlayer());
renderTable();
updateArrows();
</script>
</body>
</html>
