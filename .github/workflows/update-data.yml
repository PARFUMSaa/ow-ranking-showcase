name: update-data

on:
  schedule:
    # 1時間ごとに自動更新(JST は毎時 00分。GitHub の混雑時は数分〜十数分遅れることがあります)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能(リポジトリ > Actions > update-data > Run workflow)

permissions:
  contents: write

# 実行が重ならないようにする(前の回が終わるまで次の回は待つ)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch player data (OverFast API)
        run: node update.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players-data.js
          if git diff --cached --quiet; then
            echo "データに変更なし"
          else
            git commit -m "chore: プレイヤーデータを自動更新 [skip ci]"
            git push
          fi
